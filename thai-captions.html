<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Captions</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@700&family=Prompt:wght@700&family=Sarabun:wght@700&family=Mitr:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f4f4f6;--fg:#16161a;--mut:#6b6b76;--card:#fff;--line:#d6d6de;--acc:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f0f12;--fg:#f2f2f5;--mut:#9a9aa6;--card:#1a1a20;--line:#2d2d36}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Sarabun",system-ui,sans-serif;font-size:16px}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.stage{width:min(100%,300px);margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
canvas{width:100%;height:auto;display:block}
.stage{position:relative}
.stage canvas{position:relative;z-index:1}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:0}
.stage.rec{position:sticky;top:8px;z-index:20;width:110px;margin:0 0 8px auto}
.ln{display:flex;gap:8px;margin:6px 0}
.ln input{flex:1;min-width:0;font:inherit;padding:8px;border-radius:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.ln button{padding:8px 10px;white-space:nowrap}
.bar{display:flex;gap:10px;align-items:center;margin:12px 0}
.bar input{flex:1}
button,input,select{font:inherit}
button{color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.row+.row{border-top:1px solid var(--line)}
.row label{color:var(--mut);font-size:14px;white-space:nowrap}
.row input[type=range],.row select,.row input[type=password]{flex:1;max-width:210px}
.row select,.row input[type=password]{padding:6px;border-radius:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.row input[type=color]{width:44px;height:30px;border:none;background:none;padding:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#msg{color:var(--mut);font-size:14px;margin:8px 0;min-height:20px;word-break:break-word}
#bar{display:none;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
#barf{height:100%;width:0;background:var(--acc);transition:width .3s}
#barf.ind{background:linear-gradient(90deg,var(--acc) 0 40%,#ffb3c1 50% 60%,var(--acc) 70%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#out video{width:100%;border-radius:12px;margin-top:8px}
small{display:block;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Thai Captions <span style="font-size:12px;color:var(--mut);font-weight:400">v10</span></h1>
<div class="stage" id="stage"><video id="vid" playsinline></video><canvas id="cv"></canvas></div>
<div class="bar"><button id="pl" type="button">▶ เล่น</button><input id="sc" type="range" min="0" max="1000" value="0" aria-label="เลื่อนเวลา"></div>

<div id="dbg" style="font:11px ui-monospace,Menlo,monospace;color:var(--mut);word-break:break-all;margin:-4px 0 10px"></div>
<div class="card">
  <div class="row"><label for="key">Groq API key</label><input id="key" type="password" autocomplete="off" placeholder="gsk_…"></div>
  <input id="file" type="file" accept="video/*" hidden>
  <div class="btns"><button id="pick" type="button">1. เลือกคลิป</button><button id="go" type="button" class="p">2. ถอดเสียง</button></div>
  <div id="bar"><div id="barf"></div></div>
  <div id="msg">ตอนนี้เป็นซับตัวอย่าง เลือกคลิปเพื่อเริ่ม</div>
</div>

<div class="seg" id="seg">
  <button type="button" data-s="pop" aria-pressed="true">Pop-up</button>
  <button type="button" data-s="karaoke" aria-pressed="false">Karaoke</button>
  <button type="button" data-s="kinetic" aria-pressed="false">Kinetic</button>
</div>
<div class="card">
  <div class="row"><label for="ft">ฟอนต์</label><select id="ft"><option>Kanit</option><option>Prompt</option><option>Sarabun</option><option>Mitr</option></select></div>
  <div class="row"><label for="sz">ขนาด <span id="szv">60</span></label><input id="sz" type="range" min="30" max="100" value="60"></div>
  <div class="row"><label for="ps">ตำแหน่ง (บน ↔ ล่าง)</label><input id="ps" type="range" min="10" max="90" value="72"></div>
  <div class="row"><label for="of">เลื่อนซับ <span id="ofv">-0.25</span> วิ (− เร็วขึ้น / + ช้าลง)</label><input id="of" type="range" min="-100" max="100" value="-25"></div>
  <div class="row"><label for="c1">สีตัวอักษร</label><input id="c1" type="color" value="#ffffff"></div>
  <div class="row"><label for="c2">สีเน้นคำที่พูด</label><input id="c2" type="color" value="#ffd400"></div>
  <div class="row"><label for="st">ขอบดำ</label><input id="st" type="checkbox" checked></div>
</div>
<div class="card" id="edcard" style="display:none"><div style="color:var(--mut);font-size:14px">แตะ ▶ เพื่อข้ามไปบรรทัดนั้น แก้ข้อความแล้วกดเสร็จบนคีย์บอร์ด</div><div id="ed"></div></div>
<button id="ex" type="button" class="p" style="width:100%">3. ส่งออกคลิปพร้อมซับ</button>
<div id="out"></div>
<small style="margin-top:12px">การส่งออกอัดแบบเรียลไทม์ (คลิป 2 นาที = รอ ~2 นาที) ต้องเปิดหน้าจอและอยู่หน้านี้ตลอด</small>
</main>
<script>
const $=id=>document.getElementById(id),cv=$("cv"),ctx=cv.getContext("2d"),vid=$("vid");
let W=540,H=960;cv.width=W;cv.height=H;
const S={style:"pop",font:"Kanit",size:60,pos:72,color:"#ffffff",hi:"#ffd400",stroke:true,off:-.25};
const msg=m=>$("msg").textContent=m;
// ---- demo data (shown until a real clip is transcribed)
const SCRIPT=[["สวัสดี","ครับ","วันนี้","มา","แนะนำ","เสื้อ","ตัวใหม่"],["ผ้าเนื้อดี","ใส่สบาย","ราคา","ไม่แพง"],["กดสั่งซื้อ","ได้เลย","ที่ลิงก์","ด้านล่าง"]];
let tt=.3;const DEMO=SCRIPT.map(ws=>{const L={words:[]};ws.forEach(w=>{const d=.25+.09*w.length;L.words.push({w,s:tt,e:tt+d});tt+=d+.04});L.s=L.words[0].s;L.e=tt-.04;tt+=.45;return L});
const DUR=tt+.4;let lines=DEMO,hasVid=false,demoT=0,playing=false,file=null;
// ---- Thai word segmentation + line grouping
function toWords(ch){let tx="";const ct=[];
  ch.forEach(c=>{const t=c.word,d=c.end-c.start;for(let i=0;i<t.length;i++)ct.push({s:c.start+d*i/t.length,e:c.start+d*(i+1)/t.length});tx+=t});
  if(!(window.Intl&&Intl.Segmenter))return ch.map(c=>({w:c.word.trim(),s:c.start,e:c.end})).filter(x=>x.w);
  const out=[];for(const g of new Intl.Segmenter("th",{granularity:"word"}).segment(tx)){
    if(!g.segment.trim())continue;const a=ct[g.index],b=ct[g.index+g.segment.length-1];if(a&&b)out.push({w:g.segment,s:a.s,e:b.e})}
  return out}
function toLines(ws){const L=[];let c=null;ws.forEach(o=>{if(!c||o.s-c.e>.7||c.t.length+o.w.length>18){c={s:o.s,e:o.e,t:"",words:[]};L.push(c)}c.words.push(o);c.t+=o.w;c.e=o.e});return L}
// ---- progress UI (stage n of 5, real % where the browser reports it)
const BASE=[0,10,40,45,70,100];let st={n:1,label:"",f:null},t0=0,tick=null;
function upd(){const{n,label,f}=st,s=Math.round((performance.now()-t0)/1000),pct=BASE[n-1]+(f==null?0:f*(BASE[n]-BASE[n-1]));
  $("bar").style.display="block";$("barf").style.width=pct+"%";$("barf").classList.toggle("ind",f==null);
  msg(`ขั้น ${n}/5 ${label}${f!=null?" "+Math.round(f*100)+"%":" (รอสักครู่)"} · ผ่านไป ${s} วิ`)}
function setP(n,label,f){st={n,label,f:f==null?null:f};upd()}
function startP(){t0=performance.now();clearInterval(tick);tick=setInterval(upd,500)}
function endP(m){clearInterval(tick);$("bar").style.display="none";msg(m)}
const readBuf=(f,cb)=>new Promise((res,rej)=>{const r=new FileReader();r.onprogress=e=>e.lengthComputable&&cb(e.loaded/e.total);r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(f)});
// ---- audio plumbing (context must be created/resumed inside a tap)
let actx=null,dst=null,mon=null,msrc=null,forceCap=false;
function releaseCtx(){if(msrc)return;try{actx&&actx.close()}catch(_){}actx=null;dst=null}
vid.preload="auto";
function ensureCtx(){if(!actx){const AC=window.AudioContext||window.webkitAudioContext;actx=new AC()}if(actx.state!=="running")actx.resume()}
function ensureSrc(){if(msrc)return;msrc=actx.createMediaElementSource(vid);dst=actx.createMediaStreamDestination();mon=actx.createGain();msrc.connect(dst);msrc.connect(mon);mon.connect(actx.destination)}
const decodeP=buf=>new Promise((res,rej)=>{const p=actx.decodeAudioData(buf,res,rej);if(p&&p.catch)p.catch(rej)});
// ---- 16 kHz mono WAV from an AudioBuffer
async function resampleWav(dec){
  setP(3,"ย่อเสียง",null);
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const off=new OAC(1,Math.max(1,Math.ceil(dec.duration*16000)),16000),s=off.createBufferSource();
  s.buffer=dec;s.connect(off.destination);s.start();
  const d=(await off.startRendering()).getChannelData(0),n=d.length,o=new DataView(new ArrayBuffer(44+n*2));
  const ws=(p,t)=>[...t].forEach((c,i)=>o.setUint8(p+i,c.charCodeAt(0)));
  ws(0,"RIFF");o.setUint32(4,36+n*2,true);ws(8,"WAVEfmt ");o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
  o.setUint32(24,16000,true);o.setUint32(28,32000,true);o.setUint16(32,2,true);o.setUint16(34,16,true);ws(36,"data");o.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,d[i]));o.setInt16(44+i*2,v<0?v*32768:v*32767,true)}
  return new Blob([o],{type:"audio/wav"})}
// ---- fallback: play the clip silently and record its audio (real time, real % progress)
async function capture(){
  ensureCtx();ensureSrc();
  const proc=actx.createScriptProcessor(4096,1,1),zero=actx.createGain(),ch=[];zero.gain.value=0;
  proc.onaudioprocess=e=>ch.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  msrc.connect(proc);proc.connect(zero);zero.connect(actx.destination);mon.gain.value=0;
  const dur=vid.duration||1;
  try{
    vid.pause();
    if(vid.currentTime>.05){vid.currentTime=0;await new Promise(r=>vid.addEventListener("seeked",r,{once:true}))}
    vid.ontimeupdate=()=>setP(2,"บันทึกเสียงจากคลิป (เล่นแบบเงียบ อย่าออกจากหน้านี้)",Math.min(1,vid.currentTime/dur));
    await new Promise((res,rej)=>{
      const w=setTimeout(()=>{if(vid.currentTime<.2)rej(new Error("คลิปไม่เริ่มเล่น (audio="+actx.state+", ready="+vid.readyState+")"))},8000);
      vid.addEventListener("ended",()=>{clearTimeout(w);res()},{once:true});
      vid.play().catch(e=>{clearTimeout(w);rej(e)})});
  }finally{vid.ontimeupdate=null;try{msrc.disconnect(proc)}catch(_){}proc.disconnect();mon.gain.value=1}
  const n=ch.reduce((a,c)=>a+c.length,0),buf=actx.createBuffer(1,Math.max(1,n),actx.sampleRate),d=new Float32Array(n);
  let o=0;ch.forEach(c=>{d.set(c,o);o+=c.length});buf.copyToChannel(d,0);
  return resampleWav(buf)}
// ---- Thai words, even time spread, and building lines from Whisper segments (more reliable than raw Thai word stamps)
const segWords=t=>window.Intl&&Intl.Segmenter?[...new Intl.Segmenter("th",{granularity:"word"}).segment(t)].map(g=>g.segment).filter(x=>x.trim()):t.split(/\s+/).filter(Boolean);
function spread(arr,a,b){const tot=arr.reduce((s,w)=>s+w.length,0)||1;let x=a;return arr.map(w=>{const d=(b-a)*w.length/tot,o={w,s:x,e:x+d};x+=d;return o})}
function fromResult(j){
  const W=j.words||[],G=j.segments||[];if(!G.length)return toLines(toWords(W));
  const out=[];
  G.forEach(sg=>{
    const ins=W.filter(w=>w.start>=sg.start-.15&&w.end<=sg.end+.15);let a=sg.start,b=sg.end;
    if(ins.length){a=Math.max(sg.start,ins[0].start);b=Math.min(sg.end,ins[ins.length-1].end)}
    if(b-a<.2){a=sg.start;b=sg.end}
    toLines(spread(segWords(sg.text||""),a,b)).forEach(l=>out.push(l))});
  return out}
const fmt=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
function renderEditor(){
  const ed=$("ed");ed.innerHTML="";$("edcard").style.display=lines.length&&hasVid?"block":"none";
  lines.forEach(L=>{const r=document.createElement("div");r.className="ln";
    const b=document.createElement("button");b.type="button";b.textContent="▶ "+fmt(L.s);b.onclick=()=>seekTo(L.s);
    const i=document.createElement("input");i.value=L.t;
    i.onchange=()=>{const w=spread(segWords(i.value),L.s,L.e);L.ch=null;L.words=w;L.t=w.map(x=>x.w).join("")};
    r.append(b,i);ed.append(r)})}
// ---- pull the audio track out of an MP4/MOV without decoding anything (tiny m4a, instant)
const rd=async(f,a,b)=>new DataView(await f.slice(a,b).arrayBuffer());
const cc=(u,o)=>String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3]);
function kids(u,s,e){const out=[],d=new DataView(u.buffer,u.byteOffset,u.byteLength);let o=s;
  while(o+8<=e){let sz=d.getUint32(o),hs=8;const ty=cc(u,o+4);
    if(sz===1){sz=Number(d.getBigUint64(o+8));hs=16}else if(sz===0)sz=e-o;
    if(sz<hs||o+sz>e)break;out.push({ty,s:o,e:o+sz,b:o+hs});o+=sz}return out}
const find=(u,bx,ty)=>kids(u,bx.b,bx.e).find(k=>k.ty===ty);
const mkbox=(ty,...ps)=>{const n=ps.reduce((a,p)=>a+p.length,0),u=new Uint8Array(8+n);new DataView(u.buffer).setUint32(0,8+n);
  for(let i=0;i<4;i++)u[4+i]=ty.charCodeAt(i);let o=8;ps.forEach(p=>{u.set(p,o);o+=p.length});return u};
async function extractAudioM4a(f){
  let o=0,mv=null;
  while(o<f.size){const h=await rd(f,o,Math.min(o+16,f.size));let sz=h.getUint32(0);
    const ty=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
    if(sz===1)sz=Number(h.getBigUint64(8));else if(sz===0)sz=f.size-o;
    if(sz<8)throw new Error("ไฟล์ไม่ใช่ MP4/MOV");
    if(ty==="moov"){mv=new Uint8Array(await f.slice(o,o+sz).arrayBuffer());break}o+=sz}
  if(!mv)throw new Error("ไม่พบข้อมูลคลิป (moov)");
  const dv=new DataView(mv.buffer,mv.byteOffset,mv.byteLength),root={b:8,e:mv.length};
  let tr=null;
  for(const t of kids(mv,8,mv.length).filter(k=>k.ty==="trak")){
    const md=find(mv,t,"mdia"),hd=md&&find(mv,md,"hdlr");
    if(hd&&cc(mv,hd.b+8)==="soun"){tr=t;break}}
  if(!tr)throw new Error("คลิปนี้ไม่มีแทร็กเสียง");
  const md=find(mv,tr,"mdia"),sb=find(mv,find(mv,md,"minf"),"stbl");
  const stsc=find(mv,sb,"stsc"),stsz=find(mv,sb,"stsz"),co=find(mv,sb,"stco")||find(mv,sb,"co64");
  if(!stsc||!stsz||!co)throw new Error("อ่านตารางเสียงไม่ได้");
  const is64=co.ty==="co64",nCh=dv.getUint32(co.b+4),offs=[];
  for(let i=0;i<nCh;i++)offs.push(is64?Number(dv.getBigUint64(co.b+8+i*8)):dv.getUint32(co.b+8+i*4));
  const nSc=dv.getUint32(stsc.b+4),sc=[];
  for(let i=0;i<nSc;i++)sc.push({f:dv.getUint32(stsc.b+8+i*12),n:dv.getUint32(stsc.b+12+i*12)});
  const fixed=dv.getUint32(stsz.b+4),ssz=i=>fixed||dv.getUint32(stsz.b+12+i*4);
  const sizes=[];let si=0,k=0;
  for(let c=1;c<=nCh;c++){while(k+1<nSc&&sc[k+1].f<=c)k++;let tot=0;for(let j=0;j<sc[k].n;j++)tot+=ssz(si++);sizes.push(tot)}
  if(!sizes.some(x=>x>0))throw new Error("ไฟล์แบบแบ่งส่วน (fragmented) ยังไม่รองรับ");
  const trak=mv.slice(tr.s,tr.e),td=new DataView(trak.buffer);
  const ftyp=mkbox("ftyp",new Uint8Array([77,52,65,32,0,0,0,0,77,52,65,32,109,112,52,50,105,115,111,109]));
  let pos=ftyp.length+8;const base=pos;
  for(let i=0;i<nCh;i++){const p=co.b-tr.s+(is64?8+i*8:8+i*4);is64?td.setBigUint64(p,BigInt(pos)):td.setUint32(p,pos);pos+=sizes[i]}
  const mvhd=find(mv,root,"mvhd"),moov=mkbox("moov",mv.slice(mvhd.s,mvhd.e),trak);
  const mh=new Uint8Array(8);new DataView(mh.buffer).setUint32(0,8+pos-base);[..."mdat"].forEach((c,i)=>mh[4+i]=c.charCodeAt(0));
  return new Blob([ftyp,mh,...offs.map((x,i)=>f.slice(x,x+sizes[i])),moov],{type:"audio/mp4"})}

let abCache=null,abFile=null;
function sendGroq(key,blob,name,extra=true){return new Promise((res,rej)=>{
  const fd=new FormData();fd.append("file",blob,name);fd.append("model","whisper-large-v3");fd.append("language","th");
  fd.append("response_format","verbose_json");fd.append("timestamp_granularities[]","word");if(extra){fd.append("timestamp_granularities[]","segment");fd.append("temperature","0")}
  const x=new XMLHttpRequest();x.open("POST","https://api.groq.com/openai/v1/audio/transcriptions");
  x.setRequestHeader("Authorization","Bearer "+key);
  x.upload.onprogress=e=>e.lengthComputable&&setP(4,"อัปโหลด",e.loaded/e.total);
  x.upload.onload=()=>setP(5,"Groq กำลังถอดเสียง",null);
  x.onerror=()=>rej(new Error("เชื่อมต่อ Groq ไม่ได้ (เน็ตหรือถูกบล็อก)"));
  x.onload=()=>{if(x.status>=200&&x.status<300)res(JSON.parse(x.responseText));
    else{const er=new Error(x.status+" "+x.responseText.slice(0,160));er.status=x.status;rej(er)}};
  x.send(fd)})}
async function transcribe(){
  const key=$("key").value.trim();if(!key)return msg("ใส่ Groq API key ก่อน");if(!file)return msg("เลือกคลิปก่อน");
  try{localStorage.setItem("gk",key)}catch(_){}
  try{
    startP();let j=null,why="";
    const call=(b,n)=>sendGroq(key,b,n,true).catch(e=>{if(e.status===400&&/timestamp|granular|temperature|segment/i.test(e.message))return sendGroq(key,b,n,false);throw e});
    // 0) best: lift the audio track out of the file (tiny m4a, no decoding, works for big clips)
    try{setP(1,"แยกเสียงออกจากคลิป",null);const ab=await extractAudioM4a(file);abFile=file;abCache=ab;
      setP(4,"อัปโหลดเสียง ("+(ab.size/1048576).toFixed(1)+" MB)",0);j=await call(ab,"a.m4a")}
    catch(e){if([401,403,429].includes(e.status))throw e;j=null;why=(e.message||"").slice(0,90)}
    // 1) otherwise send the clip itself (no local audio work) when it fits Groq's 25 MB limit
    if(!j&&file.size<=24*1048576){
      try{setP(4,"อัปโหลดคลิปตรงๆ",0);j=await call(new File([file],"clip.mp4",{type:"video/mp4"}),"clip.mp4")}
      catch(e){if([401,403,429].includes(e.status))throw e;j=null;why=(e.message||"").slice(0,90)}
    }
    // 2) otherwise extract audio here (decode, or silent real-time capture if Safari hangs)
    if(!j){
      let wav=null;
      if(!forceCap){
        try{
          const mb=(file.size/1048576).toFixed(0);if(why)msg("อัปโหลดตรงๆ ไม่ผ่าน: "+why);
          setP(1,`อ่านไฟล์ (${mb} MB)`,0);
          const buf=await readBuf(file,f=>setP(1,`อ่านไฟล์ (${mb} MB)`,f));
          setP(2,"ถอดรหัสเสียงจากคลิป (รอสูงสุด 25 วิ)",null);ensureCtx();
          const dec=await Promise.race([decodeP(buf),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),25000))]);
          wav=await resampleWav(dec);
        }catch(e){forceCap=true}
      }
      if(!wav){
        setP(2,"สลับเป็นอัดเสียงแบบเล่นจริง กำลังเริ่ม",0);
        try{wav=await capture()}
        catch(e){endP("อัดเสียงไม่สำเร็จ: "+(e.message||e.name)+" ถ้าเบราว์เซอร์ไม่ยอมเล่นคลิปเอง ให้แตะ 2. ถอดเสียง อีกครั้ง");return}
      }
      setP(4,"อัปโหลดเสียง",0);j=await call(wav,"a.wav");
    }
    try{lines=fromResult(j)}catch(_){lines=toLines(toWords(j.words||[]))}
    try{renderEditor()}catch(_){}
    endP("เสร็จแล้ว: "+lines.length+" บรรทัด กดเล่นเพื่อดูซับ");
  }catch(e){endP("ผิดพลาด: "+(e.message||e))}finally{releaseCtx()}}
// ---- drawing
const ease=x=>{x=Math.min(1,Math.max(0,x));const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fnt=s=>`700 ${s}px "${S.font}", sans-serif`;
function setFont(s){ctx.font=fnt(s);ctx.fs=s;ctx.textAlign="center";ctx.textBaseline="middle"}
function txt(str,x,y,fill,o={}){const{sc=1,rot=0,al=1}=o;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);ctx.globalAlpha=al;
  if(S.stroke){ctx.lineWidth=ctx.fs*.16;ctx.lineJoin="round";ctx.strokeStyle="#000";ctx.strokeText(str,0,0)}
  ctx.fillStyle=fill;ctx.fillText(str,0,0);ctx.restore()}
function chunks(L){if(L.ch)return L.ch;const out=[];let c=null;
  L.words.forEach(o=>{if(!c)c={w:"",s:o.s,e:o.e};c.w+=o.w;c.e=o.e;if(c.e-c.s>=.4||c.w.length>=9){out.push(c);c=null}});
  if(c)out.push(c);out.forEach((x,i)=>{x.hold=i+1<out.length?out[i+1].s:L.e+.3});return L.ch=out}
function layout(L,fs){setFont(fs);let ws=L.words.map(o=>ctx.measureText(o.w).width),tot=ws.reduce((a,b)=>a+b,0);const mx=W*.9;
  if(tot>mx){const k=mx/tot;fs*=k;ws=ws.map(w=>w*k);tot=mx;setFont(fs)}
  let x=(W-tot)/2;return ws.map(w=>{const c=x+w/2;x+=w;return{c,w}})}
function draw(t){
  ctx.clearRect(0,0,W,H);
  if(hasVid&&vid.videoWidth){ctx.drawImage(vid,0,0,W,H);if(frames%30===0){try{pxState=ctx.getImageData(4,4,1,1).data[3]>0?"ok":"blank"}catch(e){pxState="err"}}}
  else{const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#2b1f4a");g.addColorStop(1,"#0e3b4f");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  const k=W/540,fs=S.size*k,y=H*S.pos/100,L=lines.find(l=>t>=l.s-.12&&t<=l.e+.35);if(!L)return;
  if(S.style==="pop"){
    let o=null;chunks(L).forEach(x=>{if(t>=x.s)o=x});if(!o||t>o.hold)return;
    setFont(fs);const mw=ctx.measureText(o.w).width;if(mw>W*.9)setFont(fs*W*.9/mw);
    txt(o.w,W/2,y,S.hi,{sc:.55+.45*ease((t-o.s)/.22)});
  }else if(S.style==="karaoke"){
    const P=layout(L,fs);
    L.words.forEach((o,i)=>{const p=P[i];txt(o.w,p.c,y,S.color);const pr=Math.min(1,Math.max(0,(t-o.s)/((o.e-o.s)||.01)));
      if(pr>0){ctx.save();ctx.beginPath();ctx.rect(p.c-p.w/2,0,p.w*pr,H);ctx.clip();txt(o.w,p.c,y,S.hi);ctx.restore()}});
  }else{
    const P=layout(L,fs);
    L.words.forEach((o,i)=>{if(t<o.s)return;const q=Math.min(1,(t-o.s)/.28),e=ease(q),cur=t<=o.e,d=i%2?1:-1;
      txt(o.w,P[i].c+d*(1-e)*40*k,y-d*(1-e)*60*k,cur?S.hi:S.color,{sc:(cur?1.18:1)*(1.6-.6*e),rot:d*(1-e)*.5,al:Math.min(1,q*2)})});
  }}
let last=performance.now(),lastDraw=0,frames=0,errMsg="",pxState="?",dMax=0,mt=-1,mtAt=0,wc0=0,rvId=0;
function arm(){if(!vid.requestVideoFrameCallback)return;const id=++rvId;
  const cb=(n,m)=>{if(id!==rvId)return;mt=m.mediaTime;mtAt=performance.now();step(performance.now());vid.requestVideoFrameCallback(cb)};
  vid.requestVideoFrameCallback(cb)}
// best available playback time: frame time from the decoder, else currentTime, else a wall clock started when playback began
function curT(){const ct=vid.currentTime,now=performance.now();
  if(!vid.paused&&mt>=0&&now-mtAt<400)return mt;
  if(!vid.paused&&ct<.05&&wc0&&now-wc0>600)return (now-wc0)/1000;
  return ct}
vid.addEventListener("playing",()=>{wc0=performance.now()-vid.currentTime*1000;arm()});
vid.addEventListener("seeked",arm);vid.addEventListener("timeupdate",()=>step(performance.now()));
function step(n){
  try{
    const dt=Math.min(.1,(n-last)/1000);last=n;let t;
    if(hasVid){t=curT();const d=vid.duration;if(d&&isFinite(d))$("sc").value=t/d*1000}
    else{if(playing){demoT+=dt;if(demoT>DUR)demoT=0}t=demoT;$("sc").value=t/DUR*1000}
    const t0=performance.now();draw(t-S.off);dMax=Math.max(dMax*.98,performance.now()-t0);frames++;lastDraw=performance.now();
  }catch(e){errMsg=String(e&&e.message||e)}}
function frame(n){requestAnimationFrame(frame);step(n)}
setInterval(()=>{if(performance.now()-lastDraw>250)step(performance.now())},120);
setInterval(()=>{$("dbg").textContent=`t=${curT().toFixed(2)} ct=${vid.currentTime.toFixed(2)} mt=${mt.toFixed(2)} dur=${(vid.duration||0).toFixed(1)} ${vid.paused?"paused":"playing"} rs=${vid.readyState} draws=${frames} slow=${dMax.toFixed(0)}ms heals=${healN} px=${pxState}${errMsg?" ERR "+errMsg:""}`},300);
// ---- player recovery (iOS can leave <video> "playing" but frozen after the clip has ended)
let healing=false,healN=0;
async function heal(t,play){
  if(healing||!hasVid)return;healing=true;healN++;
  try{
    vid.pause();vid.load();
    await new Promise(r=>{vid.addEventListener("loadeddata",r,{once:true});setTimeout(r,3000)});
    vid.currentTime=t;await new Promise(r=>{vid.addEventListener("seeked",r,{once:true});setTimeout(r,900)});
    if(play)await vid.play();
  }catch(_){}
  healing=false;arm();lbl()}
function seekTo(t){let ok=false;const f=()=>{ok=true};vid.addEventListener("seeked",f,{once:true});vid.currentTime=t;
  setTimeout(()=>{vid.removeEventListener("seeked",f);if(!ok&&!healing)heal(t,false)},700)}
vid.addEventListener("playing",()=>{if(recSess||healing)return;const t0=vid.currentTime;
  setTimeout(()=>{if(!recSess&&!healing&&!vid.paused&&!vid.ended&&Math.abs(vid.currentTime-t0)<.05)heal(t0,true)},1600)});
vid.addEventListener("ended",()=>{if(!recSess)setTimeout(()=>heal(0,false),150)});
// ---- controls
const lbl=()=>$("pl").textContent=(hasVid?!vid.paused:playing)?"⏸ หยุด":"▶ เล่น";
$("pl").onclick=()=>{if(hasVid){if(vid.paused){if(vid.ended||(vid.duration&&vid.currentTime>=vid.duration-.05))vid.currentTime=0;vid.play().catch(()=>{})}else vid.pause()}else playing=!playing;lbl()};
vid.onplay=vid.onpause=vid.onended=lbl;
$("sc").oninput=e=>{const v=e.target.value/1000;if(hasVid)vid.currentTime=v*(vid.duration||0);else demoT=v*DUR};
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{file=e.target.files[0];if(!file)return;hasVid=false;vid.src=URL.createObjectURL(file);lines=[];msg("กำลังโหลดคลิป…")};
vid.onloadedmetadata=()=>{const s=Math.min(1,960/Math.max(vid.videoWidth,vid.videoHeight));W=Math.round(vid.videoWidth*s);H=Math.round(vid.videoHeight*s);cv.width=W;cv.height=H;hasVid=true;vid.currentTime=.01;arm();lbl();if(!healing)msg("โหลดแล้ว กด 2. ถอดเสียง")};
$("go").onclick=transcribe;
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{S.style=b.dataset.s;document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("ft").onchange=e=>{S.font=e.target.value;try{document.fonts.load(fnt(40),"กขค")}catch(_){}};
$("sz").oninput=e=>{S.size=+e.target.value;$("szv").textContent=S.size};
$("ps").oninput=e=>S.pos=+e.target.value;
$("of").oninput=e=>{S.off=e.target.value/100;$("ofv").textContent=S.off.toFixed(2)};
$("c1").oninput=e=>S.color=e.target.value;$("c2").oninput=e=>S.hi=e.target.value;
$("st").onchange=e=>S.stroke=e.target.checked;
// ---- export: record canvas + audio in real time
let recSess=null;
$("ex").onclick=async()=>{
  if(recSess){recSess.cancel();return}
  if(!hasVid||!lines.length)return msg("ต้องเลือกคลิปและถอดเสียงก่อน");
  if(!window.MediaRecorder||!cv.captureStream)return msg("เบราว์เซอร์นี้ยังอัดวิดีโอไม่ได้ ลองอัปเดต iOS");
  let cancelled=false,iv=null,bs=null;
  await heal(0,false);
  const done=()=>{clearInterval(iv);recSess=null;$("stage").classList.remove("rec");$("ex").textContent="3. ส่งออกคลิปพร้อมซับ";vid.muted=false;try{bs&&bs.stop()}catch(_){}releaseCtx();setTimeout(()=>heal(0,false),150)};
  try{
    ensureCtx();await actx.resume();if(!dst)dst=actx.createMediaStreamDestination();
    let abuf=null;
    try{msg("เตรียมเสียง…");const ab=(abFile===file&&abCache)||await extractAudioM4a(file);abFile=file;abCache=ab;abuf=await decodeP(await ab.arrayBuffer())}catch(_){}
    const st=cv.captureStream(30);if(abuf)dst.stream.getAudioTracks().forEach(t=>st.addTrack(t));
    const mt=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(m=>MediaRecorder.isTypeSupported(m));
    const rec=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:6e6,audioBitsPerSecond:128e3}:{videoBitsPerSecond:6e6}),ch=[];
    rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    rec.onstop=()=>{const was=cancelled;done();if(was){msg("ยกเลิกการอัดแล้ว");return}
      const type=rec.mimeType||"video/mp4",b=new Blob(ch,{type}),ext=type.includes("mp4")?"mp4":"webm",u=URL.createObjectURL(b);
      $("out").innerHTML=`<video src="${u}" controls playsinline></video><div class="btns"><button id="sv" type="button" class="p">บันทึก / แชร์</button><a id="dl" href="${u}" download="captioned.${ext}"><button type="button" style="width:100%">ดาวน์โหลด</button></a></div>`;
      $("sv").onclick=async()=>{const f=new File([b],"captioned."+ext,{type});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else $("dl").click()}catch(_){}};
      msg("เสร็จแล้ว กด บันทึก / แชร์ แล้วเลือก Save Video");$("out").scrollIntoView({block:"center"})};
    recSess={cancel(){cancelled=true;vid.pause();try{rec.stop()}catch(_){}}};
    $("stage").classList.add("rec");$("ex").textContent="⏹ ยกเลิกการอัด";
    vid.pause();
    if(vid.currentTime>.05){vid.currentTime=0;await new Promise(r=>vid.addEventListener("seeked",r,{once:true}))}
    vid.muted=!!abuf;await new Promise(r=>setTimeout(r,400));
    if(abuf){bs=actx.createBufferSource();bs.buffer=abuf;bs.connect(dst);
      vid.addEventListener("playing",()=>{try{bs.start(0,Math.min(vid.currentTime,abuf.duration-.01))}catch(_){}},{once:true})}
    rec.start();vid.play();
    iv=setInterval(()=>{const d=vid.duration||0,ct=curT(),p=d?ct/d:0;
      msg(`กำลังอัด ${Math.round(p*100)}% (${ct.toFixed(1)}/${d.toFixed(1)} วิ) เลื่อนหน้าได้ ภาพเล็กด้านขวาบนคือสิ่งที่กำลังอัด`+(abuf?"":" · ไม่มีเสียง")+(errMsg?" · ข้อผิดพลาด: "+errMsg:""))},300);
    vid.addEventListener("ended",()=>{if(!cancelled)rec.stop()},{once:true});
  }catch(e){done();msg("ส่งออกไม่สำเร็จ: "+(e.message||e))}};
try{$("key").value=localStorage.getItem("gk")||""}catch(_){}
try{["Kanit","Prompt","Sarabun","Mitr"].forEach(f=>document.fonts.load(`700 40px "${f}"`,"กขค"))}catch(_){}
requestAnimationFrame(frame);
</script>
